<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeremy 數學偵探 V6.0 - 極限挑戰</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&family=Roboto+Mono:wght@700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; user-select: none; }
        .math-font { font-family: 'Roboto Mono', monospace; }
        .grid-vertical { display: grid; grid-template-columns: 3rem 4rem 4rem 4rem; align-items: center; justify-items: center; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const App = () => {
            const [problem, setProblem] = useState(null);
            const [blankSteps, setBlankSteps] = useState([]); // 存放 4 個挖空的位置資訊
            const [currentStepIdx, setCurrentStepIdx] = useState(0); // 當前填到第幾個空格
            const [isFinished, setIsFinished] = useState(false);
            const [message, setMessage] = useState("找出隱藏的數字！");

            // 生成題目的核心邏輯
            const generateProblem = useCallback(() => {
                const types = ['ADD_2', 'SUB_2', 'ADD_3', 'MIXED_3'];
                const type = types[Math.floor(Math.random() * types.length)];
                
                let rows = []; // 每行存 [百位, 十位, 個位]
                let symbols = [""];
                let resultVal = 0;

                if (type === 'ADD_2') {
                    const n1 = Math.floor(Math.random() * 60) + 10;
                    const n2 = Math.floor(Math.random() * 30) + 9;
                    resultVal = n1 + n2;
                    rows = [splitNum(n1), splitNum(n2)];
                    symbols = ["", "+"];
                } else if (type === 'SUB_2') {
                    const n1 = Math.floor(Math.random() * 50) + 40;
                    const n2 = Math.floor(Math.random() * 30) + 5;
                    resultVal = n1 - n2;
                    rows = [splitNum(n1), splitNum(n2)];
                    symbols = ["", "-"];
                } else if (type === 'ADD_3') {
                    const n1 = Math.floor(Math.random() * 20) + 5;
                    const n2 = Math.floor(Math.random() * 20) + 5;
                    const n3 = Math.floor(Math.random() * 20) + 5;
                    resultVal = n1 + n2 + n3;
                    rows = [splitNum(n1), splitNum(n2), splitNum(n3)];
                    symbols = ["", "+", "+"];
                } else {
                    const n1 = Math.floor(Math.random() * 50) + 30;
                    const n2 = Math.floor(Math.random() * 20) + 10;
                    const n3 = Math.floor(Math.random() * 10) + 5;
                    resultVal = n1 + n2 - n3;
                    rows = [splitNum(n1), splitNum(n2), splitNum(n3)];
                    symbols = ["", "+", "-"];
                }

                const resultRow = splitNum(resultVal);
                
                // 收集所有可以挖空的位置 (排除百位是 0 的情況)
                let candidates = [];
                rows.forEach((r, rIdx) => {
                    r.forEach((v, cIdx) => candidates.push({ type: 'row', rIdx, cIdx, val: v }));
                });
                resultRow.forEach((v, cIdx) => candidates.push({ type: 'res', rIdx: -1, cIdx, val: v }));

                // 隨機選 4 個空格
                const shuffled = candidates.sort(() => 0.5 - Math.random());
                const selectedBlanks = shuffled.slice(0, 4).sort((a, b) => b.cIdx - a.cIdx); // 從個位(cIdx=2)往百位填

                setProblem({ rows, symbols, resultRow, type });
                setBlankSteps(selectedBlanks);
                setCurrentStepIdx(0);
                setIsFinished(false);
                setMessage("偵探，請破解這 4 個數字！");
            }, []);

            const splitNum = (n) => [
                Math.floor(n / 100), 
                Math.floor((n % 100) / 10), 
                n % 10
            ];

            useEffect(() => { generateProblem(); }, [generateProblem]);

            const handleInput = (num) => {
                if (isFinished) return;
                
                const currentBlank = blankSteps[currentStepIdx];
                if (num === currentBlank.val) {
                    if (currentStepIdx === 3) {
                        setIsFinished(true);
                        setMessage("太棒了！全部正確！🏆");
                    } else {
                        setCurrentStepIdx(prev => prev + 1);
                        setMessage("答對了，繼續下一個！");
                    }
                } else {
                    setMessage("哎呀，數字不對，再算算看！❌");
                }
            };

            if (!problem) return null;

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-[3rem] shadow-2xl border border-slate-200 w-full max-w-md">
                        <div className="text-center mb-6">
                            <span className="bg-indigo-100 text-indigo-600 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest">
                                {problem.type.replace('_', ' ')}
                            </span>
                            <h2 className="text-xl font-black text-slate-800 mt-2">{message}</h2>
                        </div>

                        {/* 直式主體 */}
                        <div className="flex justify-center mb-8">
                            <div className="grid-vertical gap-y-2">
                                {/* 題目列 */}
                                {problem.rows.map((row, rIdx) => (
                                    <React.Fragment key={rIdx}>
                                        <div className="text-3xl font-black text-slate-400 math-font">{problem.symbols[rIdx]}</div>
                                        {row.map((val, cIdx) => (
                                            <Cell 
                                                key={`${rIdx}-${cIdx}`}
                                                val={val} 
                                                isBlank={blankSteps.some(b => b.type==='row' && b.rIdx===rIdx && b.cIdx===cIdx)}
                                                isTarget={!isFinished && blankSteps[currentStepIdx]?.type==='row' && blankSteps[currentStepIdx]?.rIdx===rIdx && blankSteps[currentStepIdx]?.cIdx===cIdx}
                                                isFilled={blankSteps.findIndex(b => b.type==='row' && b.rIdx===rIdx && b.cIdx===cIdx) < currentStepIdx || isFinished}
                                            />
                                        ))}
                                    </React.Fragment>
                                ))}

                                {/* 底線 */}
                                <div className="col-span-4 w-full border-b-8 border-slate-800 my-2 rounded-full" />

                                {/* 結果列 */}
                                <div className="text-3xl font-black text-slate-800">=</div>
                                {problem.resultRow.map((val, cIdx) => (
                                    <Cell 
                                        key={`res-${cIdx}`}
                                        val={val} 
                                        isBlank={blankSteps.some(b => b.type==='res' && b.cIdx===cIdx)}
                                        isTarget={!isFinished && blankSteps[currentStepIdx]?.type==='res' && blankSteps[currentStepIdx]?.cIdx===cIdx}
                                        isFilled={blankSteps.findIndex(b => b.type==='res' && b.cIdx===cIdx) < currentStepIdx || isFinished}
                                    />
                                ))}
                            </div>
                        </div>

                        {/* 數字按鈕 */}
                        <div className="grid grid-cols-5 gap-3">
                            {[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => (
                                <button
                                    key={n}
                                    onClick={() => handleInput(n)}
                                    className="h-14 bg-indigo-600 hover:bg-indigo-700 active:scale-90 text-white text-2xl font-black rounded-2xl shadow-lg transition-all"
                                >
                                    {n}
                                </button>
                            ))}
                        </div>

                        {isFinished && (
                            <button 
                                onClick={generateProblem}
                                className="w-full mt-8 bg-green-500 hover:bg-green-600 text-white py-5 rounded-2xl font-black text-2xl shadow-xl transition-all animate-bounce"
                            >
                                下一個挑戰 ➔
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // 格子組件
        const Cell = ({ val, isBlank, isTarget, isFilled }) => {
            // 處理百位數為 0 不顯示的情況
            if (val === 0 && !isBlank && !isFilled) {
                return <div className="w-12 h-16" />;
            }

            let style = "bg-white border-slate-200 text-slate-800";
            let content = val;

            if (isBlank) {
                if (isTarget) {
                    style = "bg-amber-50 border-amber-400 animate-pulse text-amber-600 shadow-inner";
                    content = "?";
                } else if (isFilled) {
                    style = "bg-green-50 border-green-500 text-green-600 font-black";
                    content = val;
                } else {
                    style = "bg-slate-100 border-slate-200 text-transparent";
                }
            }

            return (
                <div className={`w-12 h-16 flex items-center justify-center border-4 rounded-xl text-4xl font-black math-font transition-all duration-300 ${style}`}>
                    {content}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
