<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f0f9ff">
    
    <title>Jeremy 直式挑戰 (終極版)</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Roboto+Mono:wght@500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0f9ff; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .math-font { font-family: 'Roboto Mono', monospace; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 防止 iOS safari 在橫向時放大字體 */
        html { -webkit-text-size-adjust: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, memo } = React;

        const TOTAL_QUESTIONS = 10;

        // --- 音效助手 (使用 Base64 內嵌短音效) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 簡單的音效產生器 (避免依賴外部檔案)
        const playSound = (type) => {
            // 由於瀏覽器限制，必須在用戶交互後才能播放聲音。
            // 這裡使用簡單的振盪器模擬，實際應用可替換為高品質 base64 音頻
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'success') {
                // 清脆的叮咚聲
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
                oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.1); // G5
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'error') {
                // 溫和的錯誤提示聲
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                // 簡單的慶祝聲
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2); // E5
                oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.4); // G5
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 1);
            }
        };

        // --- 獨立計時器 (防止閃爍) ---
        const TimerDisplay = memo(({ startTime }) => {
            const [time, setTime] = useState(0);
            useEffect(() => {
                if (!startTime) return;
                const interval = setInterval(() => {
                    setTime(Math.floor((Date.now() - startTime) / 1000));
                }, 1000);
                return () => clearInterval(interval);
            }, [startTime]);

            return (
                <span className="font-mono text-slate-400 font-bold">
                    {Math.floor(time / 60)}:{(time % 60).toString().padStart(2, '0')}
                </span>
            );
        });

        // --- 單個數字格 ---
        const DigitSlot = ({ q, type, row, userInputs, mode, onInput }) => {
            const key = `${type}_${row}`;
            const isBlank = q.blanks.includes(key);
            const value = q.digits[key];

            if (value === 0 && row === 't' && !isBlank) {
                 return <div className="w-12 h-14"></div>;
            }

            if (isBlank) {
                const inputValue = userInputs[key] || '';
                const isCorrect = inputValue === value.toString();
                const isLocked = mode === 'retry' && isCorrect;
                
                let borderClass = "border-blue-400 border-2 bg-white";
                if (mode === 'retry' && !isLocked) borderClass = "border-orange-400 border-4 bg-orange-50 animate-pulse"; 
                if (isLocked) borderClass = "border-green-500 bg-green-50 text-green-600 border-2";

                return (
                    <input 
                        type="tel" 
                        value={inputValue}
                        readOnly={isLocked}
                        onChange={(e) => onInput(key, e.target.value)}
                        className={`w-12 h-14 text-center text-3xl font-bold rounded-lg shadow-inner outline-none transition-all math-font ${borderClass}`}
                    />
                );
            } else {
                return (
                    <div className="w-12 h-14 flex items-center justify-center text-4xl font-black text-slate-700 math-font">
                        {value}
                    </div>
                );
            }
        };

        // --- 問題卡片 ---
        const QuestionCard = ({ q, index, userInputs, mode, feedback, onInput, onSubmit, startTime }) => {
            if (!q) return null;

            return (
                <div className="bg-white p-6 md:p-10 rounded-[2rem] shadow-xl border border-slate-200 max-w-md mx-auto fade-in">
                    <div className="flex justify-between items-center mb-8 border-b pb-4">
                        <span className="bg-slate-100 text-slate-600 px-4 py-1 rounded-full text-sm font-bold">
                            第 {index + 1} / {TOTAL_QUESTIONS} 題
                        </span>
                        <TimerDisplay startTime={startTime} />
                    </div>

                    <div className="flex flex-col items-center">
                        <div className="grid grid-cols-[2rem_3.5rem_3.5rem] gap-y-2 gap-x-1 items-center">
                            {/* N1 */}
                            <div></div>
                            <DigitSlot q={q} type="n1" row="t" userInputs={userInputs} mode={mode} onInput={onInput} />
                            <DigitSlot q={q} type="n1" row="o" userInputs={userInputs} mode={mode} onInput={onInput} />

                            {/* Op1 N2 */}
                            <div className="text-3xl font-bold text-slate-400 text-center">{q.op1}</div>
                            <DigitSlot q={q} type="n2" row="t" userInputs={userInputs} mode={mode} onInput={onInput} />
                            <DigitSlot q={q} type="n2" row="o" userInputs={userInputs} mode={mode} onInput={onInput} />

                            {/* Line 1 */}
                            <div className="col-span-3 h-1 bg-slate-800 rounded-full my-1"></div>

                            {/* R1 */}
                            <div></div>
                            <DigitSlot q={q} type="r1" row="t" userInputs={userInputs} mode={mode} onInput={onInput} />
                            <DigitSlot q={q} type="r1" row="o" userInputs={userInputs} mode={mode} onInput={onInput} />

                            {/* Op2 N3 */}
                            <div className="text-3xl font-bold text-slate-400 text-center">{q.op2}</div>
                            <DigitSlot q={q} type="n3" row="t" userInputs={userInputs} mode={mode} onInput={onInput} />
                            <DigitSlot q={q} type="n3" row="o" userInputs={userInputs} mode={mode} onInput={onInput} />

                            {/* Line 2 */}
                            <div className="col-span-3 h-1 bg-slate-800 rounded-full my-1"></div>

                            {/* R2 */}
                            <div></div>
                            <DigitSlot q={q} type="r2" row="t" userInputs={userInputs} mode={mode} onInput={onInput} />
                            <DigitSlot q={q} type="r2" row="o" userInputs={userInputs} mode={mode} onInput={onInput} />
                        </div>
                    </div>

                    <div className="mt-8 min-h-[4rem]">
                        {feedback && (
                            <div className={`p-4 rounded-xl text-center font-bold text-lg animate-bounce ${feedback.type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}`}>
                                {feedback.msg}
                            </div>
                        )}
                    </div>

                    {mode === 'normal' && (
                        <button 
                            onClick={onSubmit}
                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-2xl font-black py-4 rounded-2xl shadow-lg transition-all active:scale-95"
                        >
                            提交答案
                        </button>
                    )}
                    {mode === 'retry' && (
                        <div className="text-center text-slate-400 text-sm font-bold">
                            正在訂正模式：請填寫閃爍的格子
                        </div>
                    )}
                </div>
            );
        };

        // --- 報告卡片 (整合慶祝動畫與音效) ---
        const ReportCard = ({ history, totalTime, onRestart }) => {
            const wrongQuestions = history.filter(h => !h.passedFirstTry);
            const score = Math.round(((TOTAL_QUESTIONS - wrongQuestions.length) / TOTAL_QUESTIONS) * 100);

            // 滿分慶祝效果
            useEffect(() => {
                if (score === 100) {
                    playSound('win');
                    // 發射五彩紙屑
                    const duration = 3 * 1000;
                    const animationEnd = Date.now() + duration;
                    const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                    function randomInRange(min, max) { return Math.random() * (max - min) + min; }

                    const interval = setInterval(function() {
                        const timeLeft = animationEnd - Date.now();
                        if (timeLeft <= 0) return clearInterval(interval);
                        const particleCount = 50 * (timeLeft / duration);
                        confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
                        confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
                    }, 250);
                }
            }, [score]);

            return (
                <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-2xl mx-auto text-center fade-in relative z-10">
                    <h2 className="text-4xl font-black text-slate-800 mb-6">測驗完成！</h2>
                    <div className="flex justify-center gap-6 mb-10">
                        <div className="bg-blue-50 p-6 rounded-2xl">
                            <p className="text-xs text-blue-400 font-bold uppercase">總時間</p>
                            <p className="text-3xl font-black text-blue-900">{totalTime} 秒</p>
                        </div>
                        <div className="bg-indigo-50 p-6 rounded-2xl">
                            <p className="text-xs text-indigo-400 font-bold uppercase">分數</p>
                            <p className={`text-4xl font-black ${score === 100 ? 'text-indigo-600 animate-pulse' : 'text-indigo-900'}`}>{score}</p>
                        </div>
                    </div>
                    <div className="text-left mb-10">
                        <h3 className="text-xl font-bold text-slate-700 mb-4 border-b pb-2">表現分析：</h3>
                        {wrongQuestions.length === 0 ? (
                            <div className="text-green-600 font-black text-xl text-center py-8 bg-green-50 rounded-2xl border-2 border-dashed border-green-300">
                                🏆 太強了！Jeremy 全部答對！
                            </div>
                        ) : (
                            <ul className="space-y-4 max-h-64 overflow-y-auto custom-scrollbar">
                                {wrongQuestions.map((q, i) => (
                                    <li key={i} className="bg-red-50 p-4 rounded-xl border border-red-100">
                                        <div className="font-bold text-red-800 mb-1">第 {q.id + 1} 題需複習：</div>
                                        <div className="font-mono text-slate-600 text-lg">
                                            {q.n1} {q.op1} {q.n2} = {q.r1} <br/>
                                            {q.r1} {q.op2} {q.n3} = {q.r2}
                                        </div>
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>
                    <button onClick={onRestart} className="bg-slate-800 text-white px-8 py-4 rounded-2xl font-black text-xl hover:bg-slate-700 w-full active:scale-95 transition-all">
                        返回主選單
                    </button>
                </div>
            );
        };

        // --- 主程式邏輯 ---
        const App = () => {
            const [step, setStep] = useState('menu');
            const [qIndex, setQIndex] = useState(0);
            const [questions, setQuestions] = useState([]);
            const [userInputs, setUserInputs] = useState({});
            const [mode, setMode] = useState('normal'); 
            const [feedback, setFeedback] = useState(null);
            const [history, setHistory] = useState([]);
            const [startTime, setStartTime] = useState(null);
            const [finalTime, setFinalTime] = useState(0);

            // *** 核心邏輯：唯一解驗證題目生成器 ***
            const generateQuestions = useCallback(() => {
                let newQs = [];
                for(let i=0; i<TOTAL_QUESTIONS; i++) {
                    let validPuzzle = false;
                    let puzzleData = null;
                    while(!validPuzzle) {
                        let n1, n2, n3, r1, r2, op1, op2;
                        let validNums = false;
                        while(!validNums) {
                            n1 = Math.floor(Math.random() * 89) + 10; 
                            op1 = Math.random() > 0.5 ? '+' : '-';
                            n2 = Math.floor(Math.random() * 40) + 1;  
                            r1 = op1 === '+' ? n1 + n2 : n1 - n2;
                            if (r1 > 99 || r1 < 10) continue; 
                            op2 = Math.random() > 0.5 ? '+' : '-';
                            n3 = Math.floor(Math.random() * 40) + 1;
                            r2 = op2 === '+' ? r1 + n3 : r1 - n3;
                            if (r2 > 0 && r2 < 100) validNums = true; 
                        }
                        const digits = {
                            'n1_t': Math.floor(n1 / 10), 'n1_o': n1 % 10,
                            'n2_t': Math.floor(n2 / 10), 'n2_o': n2 % 10,
                            'r1_t': Math.floor(r1 / 10), 'r1_o': r1 % 10,
                            'n3_t': Math.floor(n3 / 10), 'n3_o': n3 % 10,
                            'r2_t': Math.floor(r2 / 10), 'r2_o': r2 % 10,
                        };
                        const constraints = [
                            ['n1_o', 'n2_o', 'r1_o'], ['n1_t', 'n2_t', 'r1_t'],
                            ['r1_o', 'n3_o', 'r2_o'], ['r1_t', 'n3_t', 'r2_t']
                        ];
                        const allKeys = Object.keys(digits);
                        const shuffledKeys = allKeys.sort(() => 0.5 - Math.random());
                        let currentBlanks = [];
                        for (let key of shuffledKeys) {
                            const testBlanks = [...currentBlanks, key];
                            const isAmbiguous = constraints.some(group => {
                                const blanksInGroup = group.filter(k => testBlanks.includes(k));
                                return blanksInGroup.length > 1;
                            });
                            if (!isAmbiguous) currentBlanks.push(key);
                            if (currentBlanks.length >= 4) break;
                        }
                        if (currentBlanks.length >= 2) {
                            validPuzzle = true;
                            puzzleData = { id: i, n1, n2, n3, r1, r2, op1, op2, digits, blanks: currentBlanks };
                        }
                    }
                    newQs.push(puzzleData);
                }
                return newQs;
            }, []);

            const startQuiz = () => {
                // 首次點擊時嘗試喚醒音頻上下文 (解決瀏覽器自動播放限制)
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                setQuestions(generateQuestions());
                setQIndex(0);
                setHistory([]);
                setUserInputs({});
                setMode('normal');
                setFeedback(null);
                setStep('quiz');
                setStartTime(Date.now());
            };

            const handleInput = (key, val) => {
                const num = val.slice(-1).replace(/[^0-9]/g, '');
                
                if (mode === 'normal') {
                    setUserInputs(prev => ({ ...prev, [key]: num }));
                } else if (mode === 'retry') {
                    const currentQ = questions[qIndex];
                    const correctVal = currentQ.digits[key].toString();
                    
                    if (num === correctVal) {
                        playSound('success'); // 播放正確音效
                        setUserInputs(prev => ({ ...prev, [key]: num }));
                        setFeedback({ type: 'success', msg: '正確！請填下一格。' });
                        const remaining = currentQ.blanks.filter(b => b !== key && userInputs[b] !== currentQ.digits[b].toString());
                        if (remaining.length === 0) {
                            setTimeout(() => nextQuestion(), 500);
                        }
                    } else {
                        playSound('error'); // 播放錯誤音效
                        let hint = "再算一次看看？";
                        if (key.includes('_o')) hint = "提示：先算個位數 (最右邊)。";
                        else hint = "提示：留意有沒有進位或退位？";
                        setFeedback({ type: 'error', msg: `不對喔！${hint}` });
                    }
                }
            };

            const submitNormal = () => {
                const currentQ = questions[qIndex];
                const allFilled = currentQ.blanks.every(key => userInputs[key] && userInputs[key].length > 0);
                if (!allFilled) {
                    setFeedback({ type: 'error', msg: '還有格子沒填喔！' });
                    playSound('error');
                    return;
                }

                let allCorrect = true;
                currentQ.blanks.forEach(key => {
                    if (userInputs[key] !== currentQ.digits[key].toString()) allCorrect = false;
                });

                if (allCorrect) {
                    playSound('success');
                    setHistory([...history, { ...currentQ, passedFirstTry: true }]);
                    nextQuestion();
                } else {
                    playSound('error');
                    setMode('retry');
                    setUserInputs({});
                    setFeedback({ type: 'error', msg: '哎呀！有地方算錯了。我們重新來一次！' });
                    let newHistory = [...history];
                    const existing = newHistory.find(h => h.id === currentQ.id);
                    if (!existing) newHistory.push({ ...currentQ, passedFirstTry: false });
                    setHistory(newHistory);
                }
            };

            const nextQuestion = () => {
                if (qIndex < TOTAL_QUESTIONS - 1) {
                    setQIndex(prev => prev + 1);
                    setUserInputs({});
                    setMode('normal');
                    setFeedback(null);
                } else {
                    setFinalTime(Math.floor((Date.now() - startTime) / 1000));
                    setStep('report');
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex items-center justify-center">
                    {step === 'menu' && (
                        <div className="text-center bg-white p-12 rounded-[3rem] shadow-2xl max-w-lg w-full fade-in">
                            <h1 className="text-4xl font-black text-slate-800 mb-4">兩步直式特訓 (終極版)</h1>
                            <p className="text-slate-500 mb-8 font-bold">已確保唯一解 + 音效 + 慶祝動畫</p>
                            <button onClick={startQuiz} className="w-full bg-indigo-600 text-white py-6 rounded-2xl text-3xl font-black shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">
                                開始挑戰
                            </button>
                        </div>
                    )}

                    {step === 'quiz' && (
                        <QuestionCard 
                            q={questions[qIndex]} 
                            index={qIndex}
                            userInputs={userInputs}
                            mode={mode}
                            feedback={feedback}
                            onInput={handleInput}
                            onSubmit={submitNormal}
                            startTime={startTime}
                        />
                    )}

                    {step === 'report' && (
                        <ReportCard 
                            history={history} 
                            totalTime={finalTime} 
                            onRestart={() => setStep('menu')} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
